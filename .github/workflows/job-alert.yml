name: JobThai Alert

on:
  workflow_dispatch:
    inputs:
      force_test:
        description: "ส่งอีเมลทดสอบทันที"
        required: true
        type: boolean
        default: false

  schedule:
    # ตรวจทุก 1 ชั่วโมง เวลาเป็น UTC
    - cron: "0 * * * *"

permissions:
  contents: write
*concurrency:
  group: jobthai-aler*
  cancel-in-progress: false

jobs*
  check-jobthai:
    runs-on: ubu*tu-latest
    timeout-minutes: 10
*    steps:
      - name: Checkout *epository
        uses: actions/ch*ckout@v4
        with:
          r*f: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check JobThai
        env:
          FORCE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_test || 'false' }}
        run: |
          python check_jobthai.py

      - name: Show detection result
        run: |
          echo "Files after checking:"
          ls -la

          if [ -f message.html ]; then
            echo "EMAIL_MESSAGE_CREATED=true"
            echo "Message size:"
            wc -c message.html
          else
            echo "EMAIL_MESSAGE_CREATED=false"
            echo "No new job email will be sent."
          fi

      - name: Verify Apps Script secret
        if: ${{ hashFiles('message.html') != '' }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          if [ -z "$APPS_SCRIPT_URL" ]; then
            echo "ERROR: APPS_SCRIPT_URL is missing"
            echo "Create the secret at:"
            echo "Settings > Secrets and variables > Actions"
            exit 1
          fi

          case "$APPS_SCRIPT_URL" in
            https://script.google.com/macros/s/*/exec)
              echo "APPS_SCRIPT_URL format looks correct"
              ;;
            *)
              echo "ERROR: APPS_SCRIPT_URL has an incorrect format"
              echo "The URL must begin with:"
              echo "https://script.google.com/macros/s/"
              echo "and end with /exec"
              exit 1
              ;;
          esac

      - name: Create JSON payload
        if: ${{ hashFiles('message.html') != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          message = Path(
              "message.html"
          ).read_text(
              encoding="utf-8"
          )

          subject_file = Path("email_subject.txt")

          if subject_file.exists():
              subject = subject_file.read_text(
                  encoding="utf-8"
              ).strip()
          else:
              subject = "พบงานใหม่ Work From Home"

          payload = {
              "subject": subject,
              "message": message,
          }

          Path("payload.json").write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print("Created payload.json")
          print("Subject:", subject)
          print("Message length:", len(message))
          PY

      - name: Send email through Apps Script
        if: ${{ hashFiles('message.html') != '' }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          echo "Sending email through Google Apps Script..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --output apps-script-response.txt \
            --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data-binary "@payload.json" \
            "$APPS_SCRIPT_URL")

          echo "Final HTTP status: $HTTP_CODE"
          echo "Apps Script response:"
          cat apps-script-response.txt
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Apps Script returned HTTP $HTTP_CODE"
            exit 1
          fi

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          response_file = Path(
              "apps-script-response.txt"
          )

          if not response_file.exists():
              print(
                  "ERROR: Apps Script response file "
                  "was not created"
              )
              sys.exit(1)

          response_text = response_file.read_text(
              encoding="utf-8"
          ).strip()

          print(
              "Response length:",
              len(response_text),
          )

          if not response_text:
              print(
                  "ERROR: Apps Script returned "
                  "an empty response"
              )
              sys.exit(1)

          try:
              response = json.loads(response_text)

          except json.JSONDecodeError as error:
              print(
                  "ERROR: Apps Script did not "
                  "return valid JSON"
              )
              print("Details:", error)
              print("Response:", response_text[:1000])
              sys.exit(1)

          if response.get("ok") is not True:
              print(
                  "ERROR from Apps Script:",
                  response.get(
                      "error",
                      "Unknown error",
                  ),
              )
              sys.exit(1)

          print("Email sent successfully")
          print(
              "Apps Script message:",
              response.get(
                  "message",
                  "Email sent",
              ),
          )
          PY

      - name: Save latest job data
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            inputs.force_test != true
          }}
        run: |
          if [ ! -f jobs.json ]; then
            echo "ERROR: jobs.json was not created"
            exit 1
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.json

          if git diff --cached --quiet; then
            echo "No changes to jobs.json"
          else
            git commit \
              -m "Update JobThai job data"

            git push origin main
          fi
